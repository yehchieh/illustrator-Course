<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Heiti TC,sans-serif"><rect width="100%" height="100%" fill="white"/><text x="60" y="66" font-size="39" fill="#202D35">鋼筆練習 02：舊教材的直線與波浪</text><text x="60" y="112" font-size="24" fill="#58666D">沿用原教材前三組造型，補上點擊順序與按鍵；每組都是一條開放路徑。</text><path d="M60 145 L1540 145" fill="none" stroke="#D8DDDF" stroke-width="1"/><path d="M60 982 L1540 982" fill="none" stroke="#D8DDDF" stroke-width="1"/><text x="60" y="1023" font-size="22" fill="#007D78">P 鋼筆　A 直接選取　+ 增加錨點　- 刪除錨點　Shift + C 錨點工具</text><text x="60" y="1062" font-size="21" fill="#58666D">橙色箭頭＝滑鼠拖曳方向。Windows：Alt／Ctrl；Mac：Option／Cmd。完成開放路徑可按 Esc。</text><text x="1460" y="1062" font-size="21" fill="#58666D">2 / 3</text><text x="70" y="212" font-size="28" fill="#007D78">6　直線</text><text x="70" y="250" font-size="23" fill="#58666D">P：依序點 1–6，不拖曳。</text><text x="70" y="281" font-size="23" fill="#58666D">自由角度，不需要按 Shift。</text><text x="70" y="312" font-size="23" fill="#58666D">最後按 Esc 結束這一條路徑。</text><path d="M755 327 L855 222 L955 327 L1070 222 L1280 370 L1460 290" fill="none" stroke="#007D78" stroke-width="4"/><rect x="751" y="323" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="748" y="359" font-size="21" fill="#007D78">1</text><rect x="851" y="218" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="848" y="254" font-size="21" fill="#007D78">2</text><rect x="951" y="323" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="948" y="359" font-size="21" fill="#007D78">3</text><rect x="1066" y="218" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1063" y="254" font-size="21" fill="#007D78">4</text><rect x="1276" y="366" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1273" y="402" font-size="21" fill="#007D78">5</text><rect x="1456" y="286" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1453" y="322" font-size="21" fill="#007D78">6</text><text x="1070" y="190" font-size="23" fill="#B75522">每點：滑鼠點一下</text><text x="70" y="465" font-size="28" fill="#007D78">7　45°／90° 直線</text><text x="70" y="503" font-size="23" fill="#58666D">P：點起點 1。</text><text x="70" y="534" font-size="23" fill="#58666D">按住 Shift，依序點 2–8。</text><text x="70" y="565" font-size="23" fill="#58666D">限制水平、垂直及 45° 倍數方向。</text><path d="M770 496 L770 596 L950 596 L950 496 L1080 496 L1080 596 L1180 496 L1280 596" fill="none" stroke="#007D78" stroke-width="4"/><rect x="766" y="492" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="763" y="478" font-size="21" fill="#007D78">1</text><rect x="766" y="592" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="763" y="626" font-size="21" fill="#007D78">2</text><rect x="946" y="592" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="943" y="626" font-size="21" fill="#007D78">3</text><rect x="946" y="492" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="943" y="478" font-size="21" fill="#007D78">4</text><rect x="1076" y="492" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1073" y="478" font-size="21" fill="#007D78">5</text><rect x="1076" y="592" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1073" y="626" font-size="21" fill="#007D78">6</text><rect x="1176" y="492" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1173" y="478" font-size="21" fill="#007D78">7</text><rect x="1276" y="592" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1273" y="626" font-size="21" fill="#007D78">8</text><text x="1120" y="450" font-size="23" fill="#B75522">2–8：Shift＋點擊</text><text x="70" y="730" font-size="28" fill="#007D78">8　連續波浪</text><text x="70" y="768" font-size="23" fill="#58666D">P＋Shift：每一點都按住並拖曳。</text><text x="70" y="799" font-size="23" fill="#58666D">1 向上、2 向下、3 向上，交替進行。</text><text x="70" y="830" font-size="23" fill="#58666D">中間兩支把手保持共線，連接才平滑。</text><path d="M780 840 C780 740 940 740 940 840 C940 940 1100 940 1100 840 C1100 740 1260 740 1260 840 C1260 940 1420 940 1420 840" fill="none" stroke="#007D78" stroke-width="4"/><rect x="776" y="836" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="773" y="945" font-size="21" fill="#007D78">1</text><path d="M802 832 L802 788" fill="none" stroke="#B75522" stroke-width="2"/><path d="M806.3148298474379 795.8982430570134 L802 788 L797.6851701525621 795.8982430570134" fill="none" stroke="#B75522" stroke-width="2"/><rect x="936" y="836" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="933" y="945" font-size="21" fill="#007D78">2</text><path d="M962 815 L962 859" fill="none" stroke="#B75522" stroke-width="2"/><path d="M957.6851701525621 851.1017569429866 L962 859 L966.3148298474379 851.1017569429866" fill="none" stroke="#B75522" stroke-width="2"/><rect x="1096" y="836" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1093" y="945" font-size="21" fill="#007D78">3</text><path d="M1122 832 L1122 788" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1126.3148298474377 795.8982430570134 L1122 788 L1117.6851701525623 795.8982430570134" fill="none" stroke="#B75522" stroke-width="2"/><rect x="1256" y="836" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1253" y="945" font-size="21" fill="#007D78">4</text><path d="M1282 815 L1282 859" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1277.6851701525623 851.1017569429866 L1282 859 L1286.3148298474377 851.1017569429866" fill="none" stroke="#B75522" stroke-width="2"/><rect x="1416" y="836" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1413" y="945" font-size="21" fill="#007D78">5</text><path d="M1442 832 L1442 788" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1446.3148298474377 795.8982430570134 L1442 788 L1437.6851701525623 795.8982430570134" fill="none" stroke="#B75522" stroke-width="2"/><text x="840" y="718" font-size="23" fill="#B75522">全程搭配 Shift，固定垂直把手</text></svg>