<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Heiti TC,sans-serif"><rect width="100%" height="100%" fill="white"/><text x="60" y="66" font-size="39" fill="#202D35">鋼筆練習 01：基本圖形與操作按鍵</text><text x="60" y="112" font-size="24" fill="#58666D">先鎖定底稿，在新圖層描線。無填色、筆畫 2–3 pt；標示的數字是操作順序。</text><path d="M60 145 L1540 145" fill="none" stroke="#D8DDDF" stroke-width="1"/><path d="M60 982 L1540 982" fill="none" stroke="#D8DDDF" stroke-width="1"/><text x="60" y="1023" font-size="22" fill="#007D78">P 鋼筆　A 直接選取　+ 增加錨點　- 刪除錨點　Shift + C 錨點工具</text><text x="60" y="1062" font-size="21" fill="#58666D">橙色箭頭＝滑鼠拖曳方向。Windows：Alt／Ctrl；Mac：Option／Cmd。完成開放路徑可按 Esc。</text><text x="1460" y="1062" font-size="21" fill="#58666D">1 / 3</text><text x="70" y="193" font-size="28" fill="#007D78">1　小屋：點擊與封閉</text><text x="70" y="231" font-size="23" fill="#58666D">P：依序點 1–5，再回點 1 封閉。</text><text x="70" y="262" font-size="23" fill="#58666D">直線只點一下；水平、垂直段可搭配 Shift。</text><path d="M865 287 L865 232 L955 184 L1045 232 L1045 287 Z" fill="none" stroke="#007D78" stroke-width="4"/><rect x="861" y="283" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="858" y="313" font-size="21" fill="#007D78">1</text><rect x="861" y="228" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="838" y="258" font-size="21" fill="#007D78">2</text><rect x="951" y="180" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="948" y="171" font-size="21" fill="#007D78">3</text><rect x="1041" y="228" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1058" y="258" font-size="21" fill="#007D78">4</text><rect x="1041" y="283" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1038" y="313" font-size="21" fill="#007D78">5</text><text x="1190" y="218" font-size="24" fill="#B75522">P 點擊</text><text x="1190" y="254" font-size="23" fill="#58666D">回到 1：點擊封閉</text><text x="70" y="355" font-size="28" fill="#007D78">2　C 型：相反方向拖曳</text><text x="70" y="393" font-size="23" fill="#58666D">P：在 1 向上拖，在 2 向下拖。</text><text x="70" y="424" font-size="23" fill="#58666D">拖曳時按 Shift，讓把手保持垂直。</text><path d="M850 439 C850 325 1180 325 1180 439" fill="none" stroke="#007D78" stroke-width="4"/><rect x="846" y="435" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="843" y="471" font-size="21" fill="#007D78">1</text><rect x="1176" y="435" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1173" y="471" font-size="21" fill="#007D78">2</text><path d="M815 430 L815 364" fill="none" stroke="#B75522" stroke-width="2"/><path d="M819.3148298474379 371.89824305701336 L815 364 L810.6851701525621 371.89824305701336" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1215 388 L1215 454" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1210.6851701525623 446.10175694298664 L1215 454 L1219.3148298474377 446.10175694298664" fill="none" stroke="#B75522" stroke-width="2"/><text x="740" y="349" font-size="21" fill="#B75522">Shift＋向上拖</text><text x="1240" y="412" font-size="21" fill="#B75522">Shift＋向下拖</text><text x="70" y="516" font-size="28" fill="#007D78">3　S 型：同方向拖曳</text><text x="70" y="554" font-size="23" fill="#58666D">P：在 1、2 都向上拖。</text><text x="70" y="585" font-size="23" fill="#58666D">搭配 Shift 固定垂直把手，完成後按 Esc。</text><path d="M850 585 C850 490 1180 680 1180 585" fill="none" stroke="#007D78" stroke-width="4"/><rect x="846" y="581" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="843" y="617" font-size="21" fill="#007D78">1</text><rect x="1176" y="581" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1198" y="617" font-size="21" fill="#007D78">2</text><path d="M815 580 L815 532" fill="none" stroke="#B75522" stroke-width="2"/><path d="M819.3148298474379 539.8982430570134 L815 532 L810.6851701525621 539.8982430570134" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1215 580 L1215 532" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1219.3148298474377 539.8982430570134 L1215 532 L1210.6851701525623 539.8982430570134" fill="none" stroke="#B75522" stroke-width="2"/><text x="740" y="518" font-size="21" fill="#B75522">Shift＋向上拖</text><text x="1210" y="518" font-size="21" fill="#B75522">Shift＋向上拖</text><text x="70" y="680" font-size="28" fill="#007D78">4　曲線接直線：收回出發把手</text><text x="70" y="718" font-size="23" fill="#58666D">1 向上拖、2 向下拖，先畫弧線。</text><text x="70" y="749" font-size="23" fill="#58666D">P 再點目前端點 2，再按 Shift 點 3。</text><path d="M850 764 C850 655 1060 655 1060 764 L1360 764" fill="none" stroke="#007D78" stroke-width="4"/><rect x="846" y="760" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="843" y="796" font-size="21" fill="#007D78">1</text><rect x="1056" y="760" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1053" y="796" font-size="21" fill="#007D78">2</text><rect x="1356" y="760" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1353" y="796" font-size="21" fill="#007D78">3</text><path d="M815 752 L815 709" fill="none" stroke="#B75522" stroke-width="2"/><path d="M819.3148298474379 716.8982430570134 L815 709 L810.6851701525621 716.8982430570134" fill="none" stroke="#B75522" stroke-width="2"/><text x="1015" y="682" font-size="22" fill="#B75522">2：P 再點一下</text><text x="1240" y="722" font-size="22" fill="#B75522">3：Shift＋點擊</text><text x="70" y="842" font-size="28" fill="#007D78">5　葉片：分開把手與尖角</text><text x="70" y="880" font-size="23" fill="#58666D">1 朝右上拖；2 朝右下拖，畫上緣。</text><text x="70" y="911" font-size="23" fill="#58666D">Alt/Option 拖 2 的出發把手，改朝左下。</text><text x="70" y="942" font-size="23" fill="#58666D">回點 1 封閉，再用 A＋Alt/Option 修兩端。</text><path d="M850 928 C920 817 1150 817 1270 900 C1160 992 950 990 850 928 Z" fill="none" stroke="#007D78" stroke-width="4"/><rect x="846" y="924" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="843" y="957" font-size="21" fill="#007D78">1</text><rect x="1266" y="896" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1283" y="900" font-size="21" fill="#007D78">2</text><path d="M1290 907 L1230 952" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1233.729696537148 943.8091902878417 L1230 952 L1238.9074923540734 950.7129180437422" fill="none" stroke="#B75522" stroke-width="2"/><text x="1130" y="831" font-size="21" fill="#B75522">Alt/Option＋拖單側把手</text></svg>