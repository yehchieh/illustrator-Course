<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Heiti TC,sans-serif"><rect width="100%" height="100%" fill="white"/><text x="60" y="66" font-size="39" fill="#202D35">鋼筆練習 03：斜向曲線、M 曲線與混合線段</text><text x="60" y="112" font-size="24" fill="#58666D">沿用原教材後三組造型，保留原名稱並補充精確操作。Alt/Option 用於控制單側把手。</text><path d="M60 145 L1540 145" fill="none" stroke="#D8DDDF" stroke-width="1"/><path d="M60 982 L1540 982" fill="none" stroke="#D8DDDF" stroke-width="1"/><text x="60" y="1023" font-size="22" fill="#007D78">P 鋼筆　A 直接選取　+ 增加錨點　- 刪除錨點　Shift + C 錨點工具</text><text x="70" y="216" font-size="28" fill="#007D78">9　連續斜向曲線（原教材 C 曲線）</text><text x="70" y="254" font-size="23" fill="#58666D">P＋Shift：每一點都朝右上 45° 拖曳。</text><text x="70" y="285" font-size="23" fill="#58666D">每段先上彎再下彎，形成連續的起伏。</text><text x="70" y="316" font-size="23" fill="#58666D">原圖名稱為 C 曲線，此處依實際輪廓練習。</text><path d="M770 330 C865 235 840 425 935 330 C1030 235 1005 425 1100 330 C1195 235 1170 425 1265 330 C1360 235 1335 425 1430 330" fill="none" stroke="#007D78" stroke-width="4"/><rect x="766" y="326" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="763" y="362" font-size="21" fill="#007D78">1</text><path d="M778 316 L813 281" fill="none" stroke="#B75522" stroke-width="2"/><path d="M810.4661442197157 289.63594666986313 L813 281 L804.3640533301369 283.5338557802843" fill="none" stroke="#B75522" stroke-width="2"/><rect x="931" y="326" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="928" y="362" font-size="21" fill="#007D78">2</text><path d="M943 316 L978 281" fill="none" stroke="#B75522" stroke-width="2"/><path d="M975.4661442197157 289.63594666986313 L978 281 L969.3640533301369 283.5338557802843" fill="none" stroke="#B75522" stroke-width="2"/><rect x="1096" y="326" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1093" y="362" font-size="21" fill="#007D78">3</text><path d="M1108 316 L1143 281" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1140.4661442197157 289.63594666986313 L1143 281 L1134.3640533301368 283.5338557802843" fill="none" stroke="#B75522" stroke-width="2"/><rect x="1261" y="326" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1258" y="362" font-size="21" fill="#007D78">4</text><path d="M1273 316 L1308 281" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1305.4661442197157 289.63594666986313 L1308 281 L1299.3640533301368 283.5338557802843" fill="none" stroke="#B75522" stroke-width="2"/><rect x="1426" y="326" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1423" y="362" font-size="21" fill="#007D78">5</text><path d="M1438 316 L1473 281" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1470.4661442197157 289.63594666986313 L1473 281 L1464.3640533301368 283.5338557802843" fill="none" stroke="#B75522" stroke-width="2"/><text x="975" y="203" font-size="23" fill="#B75522">1–5：Shift＋朝右上拖</text><text x="70" y="480" font-size="28" fill="#007D78">10　M 曲線：每段都向上拱起</text><text x="70" y="518" font-size="23" fill="#58666D">1 向上拖；2 向下拖，完成第一個拱形。</text><text x="70" y="549" font-size="23" fill="#58666D">在 2 按 Alt/Option，把出發側把手改向上。</text><text x="70" y="580" font-size="23" fill="#58666D">3、4 重複此動作；5 向下拖後結束。</text><path d="M780 610 C780 505 940 505 940 610 C940 505 1100 505 1100 610 C1100 505 1260 505 1260 610 C1260 505 1420 505 1420 610" fill="none" stroke="#007D78" stroke-width="4"/><rect x="776" y="606" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="773" y="642" font-size="21" fill="#007D78">1</text><path d="M800 600 L800 555" fill="none" stroke="#B75522" stroke-width="2"/><path d="M804.3148298474379 562.8982430570134 L800 555 L795.6851701525621 562.8982430570134" fill="none" stroke="#B75522" stroke-width="2"/><rect x="936" y="606" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="933" y="642" font-size="21" fill="#007D78">2</text><path d="M960 600 L960 555" fill="none" stroke="#B75522" stroke-width="2"/><path d="M964.3148298474379 562.8982430570134 L960 555 L955.6851701525621 562.8982430570134" fill="none" stroke="#B75522" stroke-width="2"/><rect x="1096" y="606" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1093" y="642" font-size="21" fill="#007D78">3</text><path d="M1120 600 L1120 555" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1124.3148298474377 562.8982430570134 L1120 555 L1115.6851701525623 562.8982430570134" fill="none" stroke="#B75522" stroke-width="2"/><rect x="1256" y="606" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1253" y="642" font-size="21" fill="#007D78">4</text><path d="M1280 600 L1280 555" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1284.3148298474377 562.8982430570134 L1280 555 L1275.6851701525623 562.8982430570134" fill="none" stroke="#B75522" stroke-width="2"/><rect x="1416" y="606" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1413" y="642" font-size="21" fill="#007D78">5</text><path d="M1440 600 L1440 645" fill="none" stroke="#B75522" stroke-width="2"/><path d="M1435.6851701525623 637.1017569429866 L1440 645 L1444.3148298474377 637.1017569429866" fill="none" stroke="#B75522" stroke-width="2"/><text x="730" y="453" font-size="21" fill="#B75522">2–4：先向下拖，再用 Alt/Option 改出發把手向上</text><text x="70" y="747" font-size="28" fill="#007D78">11　應用：曲線與直線切換</text><text x="70" y="785" font-size="23" fill="#58666D">1 向上、2 向下拖。P 再點 2，接直線到 3。</text><text x="70" y="816" font-size="23" fill="#58666D">在目前端點 3 向下拖，4 向上拖，畫下弧。</text><text x="70" y="847" font-size="23" fill="#58666D">P 再點 4，接直線到 5。直線搭配 Shift。</text><path d="M780 870 C780 760 940 760 940 870 L1100 870 C1100 980 1260 980 1260 870 L1420 870" fill="none" stroke="#007D78" stroke-width="4"/><rect x="776" y="866" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="773" y="902" font-size="21" fill="#007D78">1</text><rect x="936" y="866" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="933" y="902" font-size="21" fill="#007D78">2</text><rect x="1096" y="866" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1073" y="902" font-size="21" fill="#007D78">3</text><rect x="1256" y="866" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1275" y="902" font-size="21" fill="#007D78">4</text><rect x="1416" y="866" width="8" height="8" fill="white" stroke="#007D78" stroke-width="2"/><text x="1413" y="902" font-size="21" fill="#007D78">5</text><text x="875" y="750" font-size="21" fill="#B75522">2：P 再點</text><text x="1005" y="796" font-size="21" fill="#B75522">3：Shift＋向下拖</text><text x="1240" y="750" font-size="21" fill="#B75522">4：P 再點</text><text x="60" y="1054" font-size="20" fill="#58666D">空白鍵：建立錨點且滑鼠尚未放開時，按住空白鍵拖移目前錨點；平時按空白鍵則平移畫面。</text><text x="60" y="1084" font-size="20" fill="#58666D">Shift + X：交換填色與筆畫　Esc：結束目前路徑　Windows Alt＝Mac Option；Ctrl＝Cmd</text></svg>