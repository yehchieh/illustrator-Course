x;margin:8px 0}.card span{color:var(--muted);font-size:13px}.pill{display:inline-block;background:#e4efeb;border-radius:20px;padding:3px 12px;font-size:12px;color:var(--teal)}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid #b8cecb;background:#fff;color:var(--teal);border-radius:8px;padding:8px 14px;text-decoration:none}.btn:disabled{opacity:.35;cursor:default}.lesson-image{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px}.page-list{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0}.page-list a{font-size:13px;padding:6px 11px;border:1px solid var(--line);border-radius:7px;text-decoration:none;background:#fff}.page-list a.current{background:var(--teal);color:white}.transcript{white-space:pre-wrap;font-size:17px;line-height:1.9;padding:20px;background:#fff;border-radius:8px}.help{margin-top:26px;color:var(--muted);font-size:13px}details{margin:20px 0}summary{cursor:pointer;color:var(--teal);padding:9px 0}.empty{padding:36px;background:white;border-radius:12px}.mobile-toggle{display:none}.viewer{overflow:auto}.viewer.zoom .lesson-image{width:160%;max-width:none}.skip{position:absolute;left:-999px}.skip:focus{left:15px;top:10px;background:white;padding:10px;z-index:10}footer{margin-top:35px;border-top:1px solid var(--line);padding-top:15px;font-size:12px;color:var(--muted)}

</style></head><body>
<a class="skip" href="#main">跳到教學內容</a>
<header class="top"><div class="brand"><small>DESIGN CLASS / LEARNING LIBRARY</small>Illustrator 功能教學</div><div class="subtle">第二週與延伸教材 · 97 頁 · 功能索引與練習素材</div><button class="btn mobile-toggle" id="menu" aria-expanded="false">功能目錄</button></header>
<div class="layout"><aside id="sidebar"><label for="search" class="eyebrow">搜尋功能 / 操作 / 快捷鍵</label><input id="search" type="search" placeholder="例如：鋼筆、遮色片、Ctrl" autocomplete="off"><nav id="nav" aria-label="功能分類"></nav><p class="help">點選功能即可開啟教學。<br>前 91 頁依 PDF 順序；新增教學接續於後。</p></aside><main id="main" tabindex="-1"></main></div>
<script src="assets/lessons.js"></script>
<script>
const {pages,groups}=window.lessonData,main=document.getElementById('main'),search=document.getElementById('search');let active=-1;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const footer='<footer>內容依據：Illustrator_第二週_鋼筆練習整合版_v2.pdf（原 PDF 共 91 頁，第 92–97 頁依本次提供的 Illustrator_對話框教學_可編輯版.pdf 更新）。保留原講義圖解及教學文字。<br>快捷鍵：Windows 使用 Ctrl / Alt，Mac 使用 Cmd / Option；實際操作以講義各頁標示為準。</footer>';
function nav(){document.getElementById('nav').innerHTML='<a href="#home"'+(active===-1?' class="active" aria-current="page"':'')+'>所有功能<span>97 頁</span></a>'+groups.map((g,i)=>`<a href="#page-${g[1]}"${active===i?' class="active" aria-current="page"':''}>${esc(g[0])}<span>${g[1]}–${g[2]}</span></a>`).join('')}
function home(){active=-1;nav();main.innerHTML='<div class="eyebrow">選一個功能，開始練習</div><h1>今天想學哪個工具？</h1><p class="intro">從文字造型、鋼筆路徑到圖片遮色片。點選下方單元，直接查看操作與示意圖。</p><div class="cards">'+groups.map((g,i)=>`<a class="card" href="#page-${g[1]}"><span class="pill">${i>=25?'新增對話框教學':i<15?'基礎與課堂操作':i===24?'教材索引':'延伸教學'}</span><strong>${esc(g[0])}</strong><span>${g[2]-g[1]+1} 頁教學 · 教學第 ${g[1]}–${g[2]} 頁 →</span></a>`).join('')+'</div>'+footer}
function lesson(n){n=Math.max(1,Math.min(pages.length,n));const p=pages[n-1],g=groups[p.group];active=p.group;nav();main.innerHTML=`<div class="eyebrow">${esc(g[0])} / 教學第 ${n} 頁</div><h1>${esc(p.title)}</h1><div class="page-list" aria-label="本單元頁面">${pages.filter(x=>x.group===p.group).map(x=>`<a href="#page-${x.n}" class="${x.n===n?'current':''}" ${x.n===n?'aria-current="page"':''}>${x.n} · ${esc(x.title)}</a>`).join('')}</div><div class="toolbar"><div><button class="btn" id="prev" ${n===1?'disabled':''}>← 上一頁</button> <button class="btn" id="next" ${n===pages.length?'disabled':''}>下一頁 →</button></div><div><span class="subtle">${n} / ${pages.length}　</span><button class="btn" id="zoom" aria-pressed="false">放大圖解</button></div></div><div class="viewer" id="viewer"><img class="lesson-image" src="${p.image}" alt="第 ${n} 頁：${esc(p.title)}；完整文字列於下方"></div><details><summary>查看本頁文字（可選取複製）</summary><div class="transcript">${esc(p.text)}</div></details><div class="toolbar"><a class="btn" href="#home">回到所有功能</a><a class="btn" href="#page-${n<pages.length?n+1:1}">${n<pages.length?'繼續下一頁 →':'回到第一頁'}</a></div>`+footer;
 document.getElementById('prev').onclick=()=>location.hash='page-'+(n-1);document.getElementById('next').onclick=()=>location.hash='page-'+(n+1);document.getElementById('zoom').onclick=e=>{let z=document.getElementById('viewer').classList.toggle('zoom');e.target.textContent=z?'恢復大小':'放大圖解';e.target.setAttribute('aria-pressed',z)};
}
function results(q){active=-1;nav();const terms=q.toLowerCase().trim().split(/\s+/),found=pages.filter(p=>terms.every(t=>(p.title+' '+p.text+' '+groups[p.group][0]).toLowerCase().includes(t)));main.innerHTML='<div class="eyebrow">全文搜尋</div><h1>搜尋「'+esc(q)+'」</h1><p class="intro" role="status">找到 '+found.length+' 頁相關教學</p><div class="cards">'+found.map(p=>`<a class="card" href="#page-${p.n}"><span class="pill">${esc(groups[p.group][0])}</span><strong>${esc(p.title)}</strong><span>教學第 ${p.n} 頁 · 查看教學 →</span></a>`).join('')+'</div>'+(!found.length?'<p class="empty">沒有找到相關頁面，請改用較短的詞，例如「鋼筆」「遮色片」或「筆刷」。</p>':'')+footer}
function route(){const h=location.hash.slice(1);if(h.startsWith('search=')){search.value=decodeURIComponent(h.slice(7));results(search.value)}else{search.value='';let m=h.match(/^page-(\d+)$/);m?lesson(Number(m[1])):home()}document.getElementById('sidebar').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');window.scrollTo(0,0)}
search.addEventListener('input',()=>{let q=search.value.trim();history.replaceState(null,'',q?'#search='+encodeURIComponent(q):'#home');q?results(q):home()});window.addEventListener('hashchange',route);document.getElementById('menu').onclick=e=>{let open=document.getElementById('sidebar').classList.toggle('open');e.target.setAttribute('aria-expanded',open)};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,button')||e.altKey||e.ctrlKey||e.metaKey)return;let m=location.hash.match(/^#page-(\d+)$/);if(m&&['ArrowLeft','ArrowRight'].includes(e.key)){let n=Number(m[1])+(e.key==='ArrowRight'?1:-1);if(n>=1&&n<=pages.length)location.hash='page-'+n}});route();
</script><script>
// Teaching progress is stored locally, independently of the lesson content.
const progressKey='illustrator-teaching-progress-v1';
let taught=new Set(),storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(progressKey)||'[]');if(Array.isArray(saved))taught=new Set(saved.filter(n=>Number.isInteger(n)&&n>=1&&n<=pages.length));}catch(e){storageOK=false;}
const progressStyle=document.createElement('style');progressStyle.textContent=`
.teaching-progress{padding:15px 12px;margin:18px 0;background:#edf5f2;border-radius:9px}.teaching-progress progress{width:100%;accent-color:var(--teal)}.teaching-progress p{font-size:12px;margin:8px 0;color:var(--muted)}.teach-check{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-size:14px;color:var(--ink)}.teach-check input{width:19px;height:19px;margin:0;accent-color:var(--teal);flex-shrink:0}.teach-card{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden}.teach-card>.card{display:block;border:0;border-radius:0;box-shadow:none}.teach-card>.teach-check{border-top:1px solid var(--line)}.teach-card.done{border-color:#6da99d;background:#f2faf6}.progress-actions{display:flex;gap:7px;flex-wrap:wrap}.progress-actions .btn{font-size:12px;padding:5px 8px}#progress-message{font-size:12px;color:var(--teal)}@media print{.teach-check,.teaching-progress{display:none}}`;
document.head.appendChild(progressStyle);
const progressBox=document.createElement('section');progressBox.className='teaching-progress';progressBox.setAttribute('aria-label','授課進度');document.getElementById('sidebar').insertBefore(progressBox,document.getElementById('nav'));
function saveProgress(){try{localStorage.setItem(progressKey,JSON.stringify([...taught].sort((a,b)=>a-b)));storageOK=true;}catch(e){storageOK=false;}}
function checkControl(numbers,label){const el=document.createElement('label');el.className='teach-check';const box=document.createElement('input');box.type='checkbox';const count=numbers.filter(n=>taught.has(n)).length;box.checked=count===numbers.length;box.indeterminate=count>0&&count<numbers.length;const caption=document.createElement('span');caption.textContent=label+(numbers.length>1?`（${count}/${numbers.length} 頁）`:'');el.append(box,caption);box.addEventListener('change',()=>{numbers.forEach(n=>box.checked?taught.add(n):taught.delete(n));saveProgress();refreshTeaching();});return el;}
function refreshTeaching(){
 document.querySelectorAll('.teach-check').forEach(el=>el.remove());
 progressBox.innerHTML=`<strong>授課進度：${taught.size} / ${pages.length} 頁</strong><progress value="${taught.size}" max="${pages.length}" aria-label="已教過的頁數"></progress><p>${storageOK?'已自動儲存於此瀏覽器。':'此瀏覽器無法儲存，請匯出進度備份。'}<br>換電腦、瀏覽器或移動檔案前，請先匯出進度。</p><div class="progress-actions"><button class="btn" id="export-progress">匯出進度</button><button class="btn" id="import-progress">匯入進度</button></div><input id="progress-file" type="file" accept=".json,application/json" hidden><div id="progress-message" role="status"></div>`;
 document.querySelectorAll('#main .cards .card').forEach(card=>{let wrap=card.parentElement;if(!wrap.classList.contains('teach-card')){wrap=document.createElement('div');wrap.className='teach-card';card.replaceWith(wrap);wrap.append(card);}const n=Number(card.getAttribute('href').split('-').pop());const isHome=!location.hash.startsWith('#search=');const g=groups.find(g=>g[1]===n);const nums=isHome&&g?Array.from({length:g[2]-g[1]+1},(_,i)=>g[1]+i):[n];wrap.classList.toggle('done',nums.every(n=>taught.has(n)));wrap.append(checkControl(nums,nums.length>1?'整個單元已教過':'已教過'));});
 const match=location.hash.match(/^#page-(\d+)$/);if(match){const n=Math.max(1,Math.min(pages.length,Number(match[1])));const toolbar=main.querySelector('.toolbar');if(toolbar)toolbar.prepend(checkControl([n],'本頁已教過'));}
 document.querySelectorAll('#nav a').forEach((a,i)=>{if(!i)return;const g=groups[i-1],total=g[2]-g[1]+1,count=Array.from({length:total},(_,j)=>g[1]+j).filter(n=>taught.has(n)).length;a.querySelector('span').textContent=`${count===total?'✓ ':''}${count}/${total}`;});
 document.getElementById('export-progress').onclick=()=>{const blob=new Blob([JSON.stringify({format:progressKey,savedAt:new Date().toISOString(),taught:[...taught].sort((a,b)=>a-b)},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Illustrator_授課進度.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
 document.getElementById('import-progress').onclick=()=>document.getElementById('progress-file').click();
 document.getElementById('progress-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!==progressKey||!Array.isArray(data.taught)||!data.taught.every(n=>Number.isInteger(n)&&n>=1&&n<=pages.length))throw Error();data.taught.forEach(n=>taught.add(n));saveProgress();refreshTeaching();document.getElementById('progress-message').textContent='已合併匯入進度。';}catch(err){document.getElementById('progress-message').textContent='檔案格式不符，請選取匯出的授課進度 JSON。';}};
}
const originalHome=home,originalLesson=lesson,originalResults=results;
home=function(){originalHome();refreshTeaching()};lesson=function(n){originalLesson(n);refreshTeaching()};results=function(q){originalResults(q);refreshTeaching()};
refreshTeaching();

const resourceStyle=document.createElement('style');resourceStyle.textContent='.resources{margin:28px 0;padding:22px;background:#fff;border:1px solid var(--line);border-radius:12px}.resource-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.resource-item{border:1px solid var(--line);padding:16px;border-radius:9px}.resource-item strong{display:block;margin:8px 0}.resource-item p{font-size:14px;color:var(--muted)}.resource-item .btn{display:inline-block;font-size:14px}.resource-item small{display:block;color:var(--muted);margin-bottom:12px}@media print{.resources{display:none}}';document.head.appendChild(resourceStyle);

function addResources(){

 if(!document.getElementById('resource-nav')){const a=document.createElement('a');a.id='resource-nav';a.href='#resources';a.textContent='↓ 補充資料下載';document.getElementById('nav').append(a);}
 const hash=location.hash;const match=hash.match(/^#page-(\d+)$/);let items=match?resources.filter(r=>r.pages.includes(Number(match[1]))):resources;
 if(hash.startsWith('#search='))return;
 if(hash==='#resources'){main.innerHTML='<div class="eyebrow">練習素材 / DOWNLOADS</div><h1>補充資料下載</h1><p class="intro">下載底稿後，在 Illustrator 中開啟或置入，搭配教學練習。SVG 可用 Illustrator 開啟並另存 AI；JPG／PNG 是圖片底稿。</p>'+resourceCards(resources)+'<p class="help">目前素材包含 JPG、PNG 與 SVG，尚未收錄 AI 原始檔。下載素材收錄於網站資料夾，請保留資料夾結構。</p>'+footer;}
 else if(items.length){const box=document.createElement('section');box.className='resources';box.innerHTML='<h2>補充資料下載</h2><p class="subtle">'+(match?'搭配本單元使用的練習檔。':'練習底稿與向量檔，可直接下載。')+' SVG 可由 Illustrator 開啟並另存 AI。</p>'+resourceCards(items);const foot=main.querySelector('footer');main.insertBefore(box,foot);}

document.addEventListener('click',e=>{const button=e.target.closest('[data-download]');if(!button)return;const r=resources.find(x=>x.id===button.dataset.download);if(!r)return;const url=r.url;const a=document.createElement('a');a.href=url;a.download=r.filename;document.body.appendChild(a);a.click();a.remove();});

home=function(){teachingHome();addResources()};lesson=function(n){teachingLesson(n);addResources()};results=function(q){teachingResults(q);addResources()};
